name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and validate package
        run: pnpm build

      - name: Type-check README examples
        run: pnpm docs:check

      - name: Lint
        run: pnpm lint

      - name: Unused exports and files
        run: pnpm lint:unused

      - name: Type check
        run: pnpm typecheck

      - name: Test with coverage thresholds
        run: pnpm test:coverage

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Validate package metadata
        run: pnpm exec publint packages/core --pack false --strict

      - name: Verify packed package in consumer projects
        run: node packages/core/scripts/verify-consumer.mjs

      - name: Build demo
        run: pnpm build:demo

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and WebKit
        run: pnpm --filter @kuruwic/tokenized-search-input exec playwright install --with-deps chromium webkit
      - name: Run browser tests
        run: pnpm --filter @kuruwic/tokenized-search-input test:browser

  react-peer-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - react-version: 18.3.1
            types-major: 18
          - react-version: 19.1.1
            types-major: 19
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Select React ${{ matrix.react-version }}
        run: >-
          pnpm add --filter @kuruwic/tokenized-search-input --save-dev --lockfile=false
          react@${{ matrix.react-version }}
          react-dom@${{ matrix.react-version }}
          @types/react@${{ matrix.types-major }}
          @types/react-dom@${{ matrix.types-major }}
      # The late Suspense commit tests take the React 19 path only when React 19 is what
      # the suite imports, so the job fails if the selection did not take effect.
      - name: Check the selected React version
        working-directory: packages/core
        run: >-
          node -e "const [want, typesMajor] = process.argv.slice(1);
          for (const name of ['react', 'react-dom']) {
          const got = require(name + '/package.json').version;
          if (got !== want) throw new Error(name + ' is ' + got + ', expected ' + want); }
          const types = require('@types/react/package.json').version;
          if (!types.startsWith(typesMajor + '.')) throw new Error('@types/react is ' + types + ', expected ' + typesMajor + '.x');"
          ${{ matrix.react-version }} ${{ matrix.types-major }}
      - name: Type check with the selected React types
        run: pnpm --filter @kuruwic/tokenized-search-input typecheck
      - name: Run the jsdom suite
        run: pnpm --filter @kuruwic/tokenized-search-input test:run
