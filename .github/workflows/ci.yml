name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test with coverage thresholds
        run: pnpm test:coverage

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Build and validate package
        run: pnpm build

      - name: Validate package metadata
        run: pnpm exec publint packages/core --pack false --strict

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @kuruwic/tokenized-search-input exec playwright install --with-deps chromium
      - name: Run browser smoke test
        run: pnpm --filter @kuruwic/tokenized-search-input test:browser

  react-peer-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react-version: [18.3.1, 19.1.1]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Select React ${{ matrix.react-version }}
        run: pnpm add --filter @kuruwic/tokenized-search-input --save-dev --lockfile=false react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }}
      - name: Run compatibility tests
        run: pnpm --filter @kuruwic/tokenized-search-input test:run
