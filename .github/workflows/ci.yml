name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  # Everything that does not depend on the Node version, once. Packing builds the package
  # (prepack runs `pnpm build`, which validates dist), and the tarball it makes is the one
  # artifact every later check and the release use.
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and pack package
        run: pnpm --dir packages/core pack --pack-destination "$GITHUB_WORKSPACE/dist-packages"

      - name: Type-check README examples
        run: pnpm docs:check

      - name: Lint
        run: pnpm lint

      - name: Unused exports and files
        run: pnpm lint:unused

      - name: Type check
        run: pnpm typecheck

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Validate package metadata
        run: pnpm exec publint packages/core --pack false --strict

      - name: Validate packed artifact
        run: |
          node packages/core/scripts/verify-pack.mjs dist-packages/*.tgz
          pnpm exec publint dist-packages/*.tgz --strict

      - name: Build demo
        run: pnpm build:demo

      - name: Upload packed artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: dist-packages/*.tgz
          if-no-files-found: error

  # What depends on the Node version: the test suite, and installing the packed artifact.
  node:
    name: Node ${{ matrix.node-version }}
    needs: check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test with coverage thresholds
        run: pnpm test:coverage

      - name: Download packed artifact
        uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: dist-packages

      - name: Verify packed artifact in consumer projects
        run: node packages/core/scripts/verify-consumer.mjs dist-packages/*.tgz

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium, WebKit and Firefox
        run: pnpm --filter @kuruwic/tokenized-search-input exec playwright install --with-deps chromium webkit firefox
      - name: Run browser tests
        run: pnpm --filter @kuruwic/tokenized-search-input test:browser

  # The React versions to check, shared with verify-consumer.mjs.
  react-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "matrix=$(jq -c . packages/core/scripts/react-versions.json)" >> "$GITHUB_OUTPUT"

  react-peer-compatibility:
    needs: react-versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.react-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Select React ${{ matrix.react }}
        run: >-
          pnpm add --filter @kuruwic/tokenized-search-input --save-dev --lockfile=false
          react@${{ matrix.react }}
          react-dom@${{ matrix.react }}
          @types/react@${{ matrix.types }}
          @types/react-dom@${{ matrix.types }}
      # The late Suspense commit tests take the React 19 path only when React 19 is what
      # the suite imports, so the job fails if the selection did not take effect.
      - name: Check the selected React version
        working-directory: packages/core
        run: >-
          node -e "const [want, typesMajor] = process.argv.slice(1);
          for (const name of ['react', 'react-dom']) {
          const got = require(name + '/package.json').version;
          if (got !== want) throw new Error(name + ' is ' + got + ', expected ' + want); }
          const types = require('@types/react/package.json').version;
          if (!types.startsWith(typesMajor + '.')) throw new Error('@types/react is ' + types + ', expected ' + typesMajor + '.x');"
          ${{ matrix.react }} ${{ matrix.types }}
      - name: Type check with the selected React types
        run: pnpm --filter @kuruwic/tokenized-search-input typecheck
      - name: Run the jsdom suite
        run: pnpm --filter @kuruwic/tokenized-search-input test:run
