name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify release tag
        run: node packages/core/scripts/verify-tag.mjs

  # Builds, packs and validates the tarball that the release publishes.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: [tag, ci]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packed artifact
        uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: dist-packages

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-packages/*.tgz
          generate_release_notes: true
          draft: false
          prerelease: false
